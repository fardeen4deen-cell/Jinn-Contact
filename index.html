<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .contact-box {
            margin-bottom: 25px;
        }

        .contact-box p {
            font-size: 18px;
            margin: 10px 0;
            color: #555;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            color: white;
        }

        .call {
            background: #28a745;
        }

        .whatsapp {
            background: #25D366;
        }

        .email {
            background: #007bff;
        }

        button:hover {
            opacity: 0.85;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Contact Us</h1>

        <div class="contact-box">

            <p id="name">Name: Loading...</p>

            <p id="phone">Phone: Loading...</p>

            <p id="email">Email: Loading...</p>

        </div>


        <div class="buttons">

            <button class="call">
                Call
            </button>


            <button class="whatsapp">
                WhatsApp
            </button>


            <button class="email">
                Email
            </button>

        </div>

    </div>


</body>
</html>
