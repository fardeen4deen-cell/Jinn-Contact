<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact me</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    text-align:center;
    width:350px;
}

h1{
    margin-bottom:30px;
    color:#333;
}

.btn{
    display:block;
    text-decoration:none;
    color:white;
    padding:15px;
    margin:15px 0;
    border-radius:8px;
    font-size:18px;
    transition:.3s;
}

.call{
    background:#007BFF;
}

.whatsapp{
    background:#25D366;
}

.email{
    background:#E74C3C;
}

.btn:hover{
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">

    <h1>CONTACT ME</h1>

    <!-- Replace with your phone number -->
    <a href="javascript:void(0)" id="callButton" class="btn call" onclick="callPerson()">
    Loading...
</a>

    <!-- Replace with your WhatsApp number -->
    <a href="#" id="whatsappButton" class="btn whatsapp" target="_blank">
    Loading...
</a>


    <!-- Replace with your email -->
    <a href="#" id="emailButton" class="btn email">
    Loading...
</a>

</div>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyBwuXsp9X7vbX_QTmuumLyUMbijuUEn8xc",

authDomain: "jinn-contact-46240.firebaseapp.com",

databaseURL: "https://jinn-contact-46240-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId: "jinn-contact-46240",

storageBucket: "jinn-contact-46240.firebasestorage.app",

messagingSenderId: "508872584697",

appId: "1:508872584697:web:a62873c30f911b36716128"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const params = new URLSearchParams(window.location.search);

const id = params.get("id");


const contactRef = ref(db,"contacts/"+id);


let phoneNumber="";


get(contactRef).then((snapshot)=>{

   if (snapshot.exists()) {

    const data = snapshot.val();

    phoneNumber = data.phone;

    document.getElementById("callButton").innerHTML = "📞 Call Me";

    document.getElementById("whatsappButton").href =
       "https://wa.me/" + data.whatsapp

    document.getElementById("whatsappButton").innerHTML =
        "💬 WhatsApp Me";

    document.getElementById("emailButton").href =
        "mailto:" + data.email;
    document.getElementById("emailButton").innerHTML =
        "📧 Email Me";

} else {

    alert("Invalid QR Code");

}


});



window.callPerson=function(){

    if(phoneNumber===""){

        alert("Contact not loaded");

        return;

    }

    window.location.href="tel:"+phoneNumber;

};


</script>

</body>

</html>
